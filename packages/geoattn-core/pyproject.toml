[project]
name = "geoattn-core"
version = "0.1.0"
license = "MIT"
description = "Reference implementations: position encodings (WHERE) and attention normalizers (HOW MUCH)"
requires-python = ">=3.11"
# Layering rule: core depends on torch ONLY. No triton, no vllm, no sibling packages.
dependencies = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoattn_core"]
