[project]
name = "geoattn-kernels"
version = "0.1.0"
license = "MIT"
description = "Fused GPU kernels that match the geoattn-core reference normalizers"
requires-python = ">=3.11"
# Layering (ADR-0001): kernels may use core and obs, never train. Triton comes with the CUDA
# torch wheels on Linux; it is declared explicitly so CPU-only installs (CI) can still import
# and type-check this package.
dependencies = [
    "torch>=2.4",
    "geoattn-core",
    "triton>=3.8,<3.9 ; sys_platform == 'linux'",
    "triton-windows>=3.8,<3.9 ; sys_platform == 'win32'",
]

[tool.uv.sources]
geoattn-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoattn_kernels"]
