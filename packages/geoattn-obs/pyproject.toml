[project]
name = "geoattn-obs"
version = "0.1.0"
license = "MIT"
description = "Attention observability: marginal errors, entropy, effective rank, rank collapse"
requires-python = ">=3.11"
# Stage 1: metrics + hooks. Stage 3 adds a Prometheus exporter as an optional extra.
dependencies = ["torch>=2.4", "geoattn-core"]

[tool.uv.sources]
geoattn-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoattn_obs"]
