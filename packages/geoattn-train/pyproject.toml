[project]
name = "geoattn-train"
version = "0.1.0"
license = "MIT"
description = "Training / evaluation harness and experiment configs"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "pyyaml>=6.0",
    "wandb>=0.18",
    "geoattn-core",
    "geoattn-obs",
    "geoattn-kernels",
    "numpy>=2.4.6",
    "triton-windows>=3.8,<3.9 ; sys_platform == 'win32'",
]

[project.scripts]
geoattn-train = "geoattn_train.cli:main"

[tool.uv.sources]
geoattn-core = { workspace = true }
geoattn-obs = { workspace = true }
geoattn-kernels = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoattn_train"]
